services:
  taskprinter:
    build: .
    container_name: taskprinter
    restart: unless-stopped
    # BLE goes through the host's BlueZ daemon over the system D-Bus.
    network_mode: host
    # Docker's default AppArmor profile blocks D-Bus calls to BlueZ ("AccessDenied ... AddMatch").
    security_opt:
      - apparmor:unconfined
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - ./data:/data
    env_file: .env
    environment:
      TP_DATA_DIR: /data
