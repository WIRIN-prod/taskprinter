[project]
name = "taskprinter"
version = "1.0.0"
description = "Self-hosted print server, PWA and MCP server for SC03h / iPrint-family BLE mini thermal printers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22.3",
    "pillow>=10.4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "qrcode>=7.4",
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
taskprinter = "taskprinter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskprinter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
